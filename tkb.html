<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thời Khóa Biểu Lớp 1</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (xlsx) để đọc và tạo file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 {
            margin: 0;
            color: #2c3e50;
            text-transform: uppercase;
            font-size: 1.5rem;
        }

        .auth-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* Khung cài đặt chế độ xem mặc định */
        .default-view-setting {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            background-color: #e8f5e9;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            color: #2e7d32;
        }

        .default-view-setting select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #a5d6a7;
            font-weight: bold;
            color: #1b5e20;
            outline: none;
            cursor: pointer;
        }

        /* Bảng thời khóa biểu toàn tuần */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 6px;
            text-align: center;
            font-size: 14px;
            vertical-align: middle;
        }

        th {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* Kiểu dáng hiển thị môn học kèm ảnh bìa */
        .subject-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px;
            margin: 0 auto;
        }

        /* Ảnh bìa sách ở tab Toàn khóa biểu */
        .book-cover {
            width: 55px;
            height: 75px;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            background-color: #eee;
            display: block;
            margin: 0 auto;
        }

        .subject-title {
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }

        /* Chế độ xem Theo Ngày (Dành cho Học sinh) - Chia lưới 4 ô (2 cột x 2 hàng) */
        .day-view-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .session-box {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
        }

        .session-title {
            font-weight: bold;
            color: #1976d2;
            border-bottom: 2px solid #1976d2;
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Lưới 4 tiết học trong 1 buổi */
        .periods-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .period-card-grid {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .period-card-grid:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .period-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--primary-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
        }

        /* Ảnh bìa sách lớn hơn ở giao diện xem ngày */
        .book-cover-large {
            width: 65px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            background-color: #eee;
            margin-top: 5px;
            margin-bottom: 8px;
        }

        .subject-title-large {
            font-weight: bold;
            font-size: 13px;
            color: #2c3e50;
            text-align: center;
        }

        /* Giao diện nút GV Quản lý thu gọn dạng Dropdown */
        .admin-panel {
            display: none;
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .menu-toggle-btn {
            width: 100%;
            background-color: #e65100;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #f57c00;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        /* Lưu ý & Chân trang */
        .note-box {
            background-color: #fffde7;
            border-left: 5px solid #fbc02d;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Responsive UI cho điện thoại nhỏ */
        @media (max-width: 600px) {
            .day-view-container {
                grid-template-columns: 1fr;
            }
            .book-cover {
                width: 48px;
                height: 65px;
            }
            .book-cover-large {
                width: 55px;
                height: 75px;
            }
            th, td {
                padding: 6px 2px;
                font-size: 12px;
            }
            .default-view-setting {
                flex-direction: column;
                gap: 5px;
            }
        }

        /* Modal Đăng nhập & Quản lý */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Thời Khóa Biểu Lớp 1</h2>
        <button id="authBtn" class="auth-btn" onclick="openLoginModal()">Đăng nhập Admin</button>
    </div>

    <!-- Bảng điều khiển dành cho Admin -->
    <div id="adminPanel" class="admin-panel">
        <button class="menu-toggle-btn" onclick="toggleAdminMenu()">
            <span>⚙️ GV Quản lý</span>
            <span id="menuArrow">▼</span>
        </button>
        
        <div id="adminMenuContent" class="menu-content">
            <div class="admin-actions">
                <button onclick="toggleEditMode()" class="auth-btn" style="background:#2196F3;">✏️ Chỉnh sửa TKB thủ công</button>
                <button onclick="openBookManager()" class="auth-btn" style="background:#ff9800;">📚 Quản lý Ảnh bìa sách</button>
                <button onclick="downloadExcelTemplate()" class="auth-btn" style="background:#388e3c;">📥 Tải file mẫu Excel</button>
            </div>
            <div class="admin-actions" style="margin-top: 5px; border-top: 1px dashed #ffa726; padding-top: 10px;">
                <input type="file" id="excelFile" accept=".xlsx, .xls" style="font-size: 13px; max-width: 200px;">
                <button onclick="importExcelSchedule()" class="auth-btn" style="background:#8e24aa;">📤 Nhập TKB từ Excel</button>
            </div>
        </div>
    </div>

    <!-- Thanh chuyển đổi Chế độ Xem -->
    <div class="controls">
        <button id="btnToday" class="tab-btn active" onclick="switchView('day_view')">Lịch Theo Ngày</button>
        <button id="btnFull" class="tab-btn" onclick="switchView('full')">Toàn khóa biểu</button>
    </div>

    <!-- Cài đặt chế độ xem ngày mặc định (Lưu vào localStorage) -->
    <div class="default-view-setting">
        <label for="defaultDayModeSelect"><b>⚙️ Chế độ xem ngày mặc định khi mở trang:</b></label>
        <select id="defaultDayModeSelect" onchange="changeDefaultDayMode(this.value)">
            <option value="today">Hôm nay (Thực tế)</option>
            <option value="next_day">Ngày tiếp theo (Soạn bài)</option>
        </select>
    </div>

    <!-- VIEW 1: Xem Theo Ngày (Chia lưới 4 ô) -->
    <div id="todayView">
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px;">
            <h3 id="currentDayTitle" style="text-align: center; color: #388e3c; margin: 0;"></h3>
            <button id="toggleDayModeBtn" onclick="toggleActiveDayMode()" style="padding: 4px 10px; border-radius: 12px; border: 1px solid #388e3c; background: #e8f5e9; color: #2e7d32; cursor: pointer; font-size: 12px; font-weight: bold;">
                🔄 Chuyển sang ngày tiếp theo
            </button>
        </div>
        <div class="day-view-container">
            <div class="session-box">
                <div class="session-title">☀️ BUỔI SÁNG</div>
                <div id="morningPeriods" class="periods-grid"></div>
            </div>
            <div class="session-box">
                <div class="session-title">🌙 BUỔI CHIỀU</div>
                <div id="afternoonPeriods" class="periods-grid"></div>
            </div>
        </div>
    </div>

    <!-- VIEW 2: Xem Toàn tuần -->
    <div id="fullView" class="table-responsive" style="display: none;">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th style="width: 8%;">Thứ</th>
                    <th style="width: 8%;">Tiết</th>
                    <th style="width: 42%;">SÁNG</th>
                    <th style="width: 42%;">CHIỀU</th>
                </tr>
            </thead>
            <tbody id="fullTableBody">
                <!-- Nội dung tự động nạp từ JS -->
            </tbody>
        </table>
    </div>

    <!-- Phần Ghi chú & Liên hệ GVCN -->
    <div class="note-box">
        <p><b>📌 Lưu ý đến lớp:</b> <span id="noteText">Đang tải...</span></p>
        <p><b>👩‍🏫 GVCN:</b> <span id="teacherInfo">Đang tải...</span></p>
    </div>
</div>

<!-- Modal Đăng Nhập -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>Đăng Nhập Quản Trị</h3>
        <input type="email" id="loginEmail" placeholder="Email giáo viên">
        <input type="password" id="loginPassword" placeholder="Mật khẩu">
        <button onclick="login()" class="auth-btn" style="width: 100%;">Đăng nhập</button>
        <button onclick="closeLoginModal()" style="width: 100%; margin-top: 5px; background: #ccc; border:none; padding:8px; border-radius:4px;">Hủy</button>
    </div>
</div>

<!-- Modal Quản lý Ảnh Bìa Sách -->
<div id="bookModal" class="modal">
    <div class="modal-content" style="width: 400px; max-height: 80vh; overflow-y: auto;">
        <h3>Cập nhật Ảnh Bìa Sách</h3>
        <div id="bookList"></div>
        <button onclick="closeBookModal()" style="width: 100%; margin-top: 10px; background: #ccc; border:none; padding:8px; border-radius:4px;">Đóng</button>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // 1. CẤU HÌNH SUPABASE & BIẾN TOÀN CỤC
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://ncbgdgmblzvcpytvlrpm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GSlqWL9EKPhToWw3yI20lA_nU2PV8fV";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let subjectsMap = {}; 
    let scheduleData = [];
    let isEditMode = false;
    let currentUser = null;

    // Biến quản lý chế độ xem ngày hiện tại ('today' hoặc 'next_day')
    let currentDayMode = localStorage.getItem('tkb_default_day_mode') || 'today';

    const days = [2, 3, 4, 5, 6];
    const periods = [1, 2, 3, 4];

    window.onload = async () => {
        // Cập nhật giá trị ô select từ localStorage
        document.getElementById('defaultDayModeSelect').value = currentDayMode;

        checkSession();
        await loadSubjects();
        await loadSchedule();
        await loadSettings();
        switchView('day_view');
    };

    // Lưu lựa chọn cài đặt mặc định vào LocalStorage
    function changeDefaultDayMode(mode) {
        currentDayMode = mode;
        localStorage.setItem('tkb_default_day_mode', mode);
        renderTodayView();
    }

    // Nút bấm nhanh để đổi chế độ xem giữa Hôm nay <-> Ngày tiếp theo
    function toggleActiveDayMode() {
        currentDayMode = (currentDayMode === 'today') ? 'next_day' : 'today';
        renderTodayView();
    }

    async function checkSession() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            currentUser = session.user;
            document.getElementById('authBtn').innerText = "Đăng xuất";
            document.getElementById('authBtn').onclick = logout;
            document.getElementById('adminPanel').style.display = "block";
        }
    }

    async function loadSubjects() {
        const { data, error } = await db.from('subjects').select('*');
        if (!error && data) {
            data.forEach(sub => {
                subjectsMap[sub.name] = sub.cover_url;
            });
        }
    }

    async function loadSchedule() {
        const { data, error } = await db.from('schedule').select('*');
        if (!error && data) {
            scheduleData = data;
            renderFullTable();
            renderTodayView();
        }
    }

    async function loadSettings() {
        const { data } = await db.from('settings').select('*');
        if (data) {
            data.forEach(item => {
                if (item.key === 'note_text') document.getElementById('noteText').innerText = item.value;
                if (item.key === 'teacher_info') document.getElementById('teacherInfo').innerText = item.value;
            });
        }
    }

    function toggleAdminMenu() {
        const menu = document.getElementById('adminMenuContent');
        const arrow = document.getElementById('menuArrow');
        if (menu.style.display === 'flex') {
            menu.style.display = 'none';
            arrow.innerText = '▼';
        } else {
            menu.style.display = 'flex';
            arrow.innerText = '▲';
        }
    }

    function switchView(view) {
        document.getElementById('btnToday').classList.toggle('active', view === 'day_view');
        document.getElementById('btnFull').classList.toggle('active', view === 'full');
        
        if (view === 'day_view') {
            document.getElementById('todayView').style.display = 'block';
            document.getElementById('fullView').style.display = 'none';
        } else {
            document.getElementById('todayView').style.display = 'none';
            document.getElementById('fullView').style.display = 'block';
        }
    }

    function getSubject(day, period, session) {
        const item = scheduleData.find(s => s.day_of_week === day && s.period === period && s.session === session);
        return item ? item.subject_name : '';
    }

    // Hiển thị môn học cho bảng toàn tuần (Ảnh vừa)
    function renderSubjectHTML(subjectName) {
        if (!subjectName) return '<span>---</span>';
        const coverUrl = subjectsMap[subjectName];
        let imgTag = coverUrl ? `<img src="${coverUrl}" class="book-cover" alt="${subjectName}">` : '';
        return `
            <div class="subject-card">
                ${imgTag}
                <span class="subject-title">${subjectName}</span>
            </div>
        `;
    }

    // Hiển thị môn học cho giao diện Lưới Ngày (Ảnh lớn rõ nét)
    function renderSubjectLargeHTML(subjectName) {
        if (!subjectName) return '<span style="color:#aaa; font-style:italic; font-size:12px;">Trống</span>';
        const coverUrl = subjectsMap[subjectName];
        let imgTag = coverUrl ? `<img src="${coverUrl}" class="book-cover-large" alt="${subjectName}">` : '<div style="height:90px; display:flex; align-items:center; color:#999;">Không có ảnh</div>';
        return `
            ${imgTag}
            <span class="subject-title-large">${subjectName}</span>
        `;
    }

    // Hiển thị giao diện "Xem Theo Ngày" dựa trên chế độ 'today' hoặc 'next_day'
    function renderTodayView() {
        const todayDate = new Date();
        let dayOfWeek = todayDate.getDay() + 1; // 1: CN, 2: T2, ..., 7: T7

        let targetDay = dayOfWeek;
        let modeLabel = "(HÔM NAY)";

        if (currentDayMode === 'next_day') {
            modeLabel = "(NGÀY TIẾP THEO)";
            // Nếu hôm nay là Thứ 2 đến Thứ 5 -> Lấy ngày tiếp theo (+1)
            // Nếu hôm nay là Thứ 6, Thứ 7 hoặc Chủ Nhật -> Lấy Thứ 2 tuần sau
            if (dayOfWeek >= 2 && dayOfWeek <= 5) {
                targetDay = dayOfWeek + 1;
            } else {
                targetDay = 2; // Thứ 2
            }
        } else {
            // Nếu chọn Hôm Nay nhưng trùng thứ 7 (7) hoặc CN (1) thì mặc định hiển thị Thứ 2
            if (dayOfWeek === 1 || dayOfWeek === 7) targetDay = 2;
        }

        // Cập nhật tiêu đề và nút chuyển đổi nhanh
        document.getElementById('currentDayTitle').innerText = `LỊCH HỌC THỨ ${targetDay} ${modeLabel}`;
        document.getElementById('toggleDayModeBtn').innerText = (currentDayMode === 'today') 
            ? '🔄 Xem ngày tiếp theo' 
            : '🔄 Xem hôm nay';

        let morningHTML = '';
        let afternoonHTML = '';

        periods.forEach(p => {
            const morningSub = getSubject(targetDay, p, 'morning');
            const afternoonSub = getSubject(targetDay, p, 'afternoon');

            morningHTML += `
                <div class="period-card-grid">
                    <div class="period-badge">${p}</div>
                    ${renderSubjectLargeHTML(morningSub)}
                </div>`;

            afternoonHTML += `
                <div class="period-card-grid">
                    <div class="period-badge">${p}</div>
                    ${renderSubjectLargeHTML(afternoonSub)}
                </div>`;
        });

        document.getElementById('morningPeriods').innerHTML = morningHTML;
        document.getElementById('afternoonPeriods').innerHTML = afternoonHTML;
    }

    function renderFullTable() {
        const tbody = document.getElementById('fullTableBody');
        tbody.innerHTML = '';

        days.forEach(d => {
            periods.forEach((p, index) => {
                const tr = document.createElement('tr');
                if (index === 0) {
                    tr.innerHTML += `<td rowspan="4"><b>${d}</b></td>`;
                }
                tr.innerHTML += `<td>${p}</td>`;

                const mSub = getSubject(d, p, 'morning');
                const aSub = getSubject(d, p, 'afternoon');

                if (isEditMode) {
                    tr.innerHTML += `<td>${renderSelectSubject(d, p, 'morning', mSub)}</td>`;
                    tr.innerHTML += `<td>${renderSelectSubject(d, p, 'afternoon', aSub)}</td>`;
                } else {
                    tr.innerHTML += `<td>${renderSubjectHTML(mSub)}</td>`;
                    tr.innerHTML += `<td>${renderSubjectHTML(aSub)}</td>`;
                }
                tbody.appendChild(tr);
            });
        });
    }

    function renderSelectSubject(day, period, session, currentSub) {
        let options = `<option value="">-- Trống --</option>`;
        Object.keys(subjectsMap).forEach(sub => {
            options += `<option value="${sub}" ${sub === currentSub ? 'selected' : ''}>${sub}</option>`;
        });
        return `<select onchange="updateSchedule(${day}, ${period}, '${session}', this.value)">${options}</select>`;
    }

    // Excel functions
    function downloadExcelTemplate() {
        const sampleData = [
            { day_of_week: 2, period: 1, session: "morning", subject_name: "HĐTN" },
            { day_of_week: 2, period: 2, session: "morning", subject_name: "Tiếng Việt" },
            { day_of_week: 2, period: 3, session: "morning", subject_name: "Tiếng Việt" },
            { day_of_week: 2, period: 4, session: "morning", subject_name: "Toán" },
            { day_of_week: 2, period: 1, session: "afternoon", subject_name: "Tiếng Anh" },
            { day_of_week: 2, period: 2, session: "afternoon", subject_name: "Tiếng Việt" },
            { day_of_week: 2, period: 3, session: "afternoon", subject_name: "Tiếng Việt" },
            { day_of_week: 2, period: 4, session: "afternoon", subject_name: "" },
        ];

        const worksheet = XLSX.utils.json_to_sheet(sampleData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "ThoiKhoaBieu");
        XLSX.writeFile(workbook, "mau_thoi_khoa_bieu.xlsx");
    }

    async function importExcelSchedule() {
        const fileInput = document.getElementById('excelFile');
        if (!fileInput.files.length) {
            return alert("Vui lòng chọn một file Excel (.xlsx hoặc .xls)!");
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function (e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet);

                if (!rows.length) {
                    return alert("File Excel không có dữ liệu!");
                }

                let count = 0;
                for (let row of rows) {
                    if (row.day_of_week && row.period && row.session) {
                        const { error } = await db.from('schedule').upsert({
                            day_of_week: parseInt(row.day_of_week),
                            period: parseInt(row.period),
                            session: String(row.session).trim(),
                            subject_name: row.subject_name ? String(row.subject_name).trim() : ''
                        }, { onConflict: 'day_of_week,period,session' });

                        if (!error) count++;
                    }
                }

                alert(`Nhập thành công ${count} tiết học từ file Excel!`);
                await loadSchedule();
                fileInput.value = "";
            } catch (err) {
                alert("Lỗi đọc file Excel: " + err.message);
            }
        };

        reader.readAsArrayBuffer(file);
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        
        if (error) {
            alert("Đăng nhập thất bại: " + error.message);
        } else {
            // Lấy thông tin thiết bị / trình duyệt (User Agent thay thế cho MAC ở tầng web)
            const deviceInfo = navigator.userAgent;

            // Lấy IP client (nếu có thể qua dịch vụ miễn phí)
            let ipAddress = "Không xác định";
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                ipAddress = ipData.ip;
            } catch (e) {
                console.log("Không lấy được IP");
            }

            // Lưu lịch sử đăng nhập vào bảng login_logs trên Database
            const { error: logError } = await db.from('login_logs').insert([
                { 
                    email: email, 
                    device_info: deviceInfo, 
                    ip_address: ipAddress 
                }
            ]);

            if (logError) {
                console.error("Lỗi ghi lịch sử đăng nhập:", logError.message);
            }

            alert("Đăng nhập thành công!");
            location.reload();
        }
    }

    async function logout() {
        await db.auth.signOut();
        location.reload();
    }

    function toggleEditMode() {
        isEditMode = !isEditMode;
        switchView('full');
        renderFullTable();
    }

    async function updateSchedule(day, period, session, subjectName) {
        const { error } = await db.from('schedule').upsert({
            day_of_week: day,
            period: period,
            session: session,
            subject_name: subjectName
        }, { onConflict: 'day_of_week,period,session' });

        if (error) alert("Lỗi khi lưu: " + error.message);
        else await loadSchedule();
    }

    function openBookManager() {
        document.getElementById('bookModal').style.display = 'flex';
        const listDiv = document.getElementById('bookList');
        listDiv.innerHTML = '';

        Object.keys(subjectsMap).forEach(subName => {
            const coverUrl = subjectsMap[subName];
            listDiv.innerHTML += `
                <div style="border-bottom:1px solid #ccc; padding: 10px 0;">
                    <b>${subName}</b><br>
                    ${coverUrl ? `<img src="${coverUrl}" style="height:50px"><br>` : ''}
                    <input type="file" id="file_${subName}" accept="image/*">
                    <button onclick="uploadCover('${subName}')">Tải ảnh lên</button>
                </div>
            `;
        });
    }

    function closeBookModal() { document.getElementById('bookModal').style.display = 'none'; }

    async function uploadCover(subjectName) {
        const fileInput = document.getElementById(`file_${subjectName}`);
        if (!fileInput.files.length) return alert("Vui lòng chọn 1 tệp ảnh!");

        const file = fileInput.files[0];
        const filePath = `covers/${Date.now()}_${file.name}`;

        const { data: uploadData, error: uploadErr } = await db.storage.from('book-covers').upload(filePath, file);
        if (uploadErr) return alert("Lỗi upload: " + uploadErr.message);

        const { data: urlData } = db.storage.from('book-covers').getPublicUrl(filePath);
        const publicUrl = urlData.publicUrl;

        const { error: dbErr } = await db.from('subjects').update({ cover_url: publicUrl }).eq('name', subjectName);
        if (dbErr) return alert("Lỗi cập nhật CSDL: " + dbErr.message);

        alert("Thành công!");
        await loadSubjects();
        openBookManager();
        renderFullTable();
        renderTodayView();
    }
</script>
